<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ZPD Location Choice</title>

  <link rel="stylesheet" href="/Zootropolis/choise/choise.css" />
</head>

<body>

  <main class="choice-page">

    <!-- BACKGROUND -->
    <img
      src="/Zootropolis/assets/choise.png"
      alt="ZPD Choice Background"
      class="choice-bg"
    />

    <!-- DARK OVERLAY -->
    <div class="choice-darkness"></div>

    <button class="exit-btn" onclick="window.location.href='/Zootropolis/briefingroom/briefingroom.html'">
    ✕ Exit
    </button>

    <!-- CHOICE PANEL -->
    <section class="choice-panel">

      <!-- ICEWORLD -->
      <button class="choice-card" id="iceworldBtn" onclick="window.location.href='/Zootropolis/iceworld/iceworld.html'">
      <img
      src="/Zootropolis/assets/iceworld.png"
      alt="Iceworld"
      class="choice-image"
      />
      <h2>ICEWORLD</h2>
      </button>

      <!-- ZOOTROPOLIS CITY -->
      <button class="choice-card" id="zootropolisBtn">
        <img
          src="/Zootropolis/assets/zootropoliscity.png"
          alt="Zootropolis City"
          class="choice-image"
        />

        <h2>ZOOTROPOLIS<br>CITY</h2>
      </button>

      <!-- JUNGLE -->
      <button class="choice-card" id="jungleBtn">
        <img
          src="/Zootropolis/assets/forest.png"
          alt="Jungle"
          class="choice-image"
        />

        <h2>JUNGLE</h2>
      </button>

    </section>

  </main>

  <script src="/Zootropolis/choise/choise.js"></script>
</body>
</html>
